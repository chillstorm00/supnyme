<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connexion — SUP'NYME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script src="theme.js"></script>
</head>
<body class="auth-page">
  <div class="auth-screen">
    <div class="auth-card">
      <p class="auth-card__brand">SUP'<span>NYME</span></p>
      <h1>Connexion</h1>

      <form id="form-login" class="auth-card__form">
        <label for="pseudo">Pseudo</label>
        <input type="text" id="pseudo" placeholder="Ton pseudo" autocomplete="username" required />

        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Ton mot de passe" autocomplete="current-password" required />

        <button type="submit" class="btn-block">Se connecter</button>
      </form>

      <p class="auth-card__error" id="error"></p>
      <p class="auth-card__switch">Pas encore de compte ? <a href="register.html">S'inscrire</a></p>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
